name: Build Windows x64 EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 standalone executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.22.2

      - name: Run tests before packaging
        run: python -m unittest discover -s tests -v

      - name: Build one-file console EXE
        run: >-
          pyinstaller
          --clean
          --noconfirm
          --onefile
          --name clash-listener-test-win-x64
          test_listeners.py

      - name: Smoke test packaged executable
        shell: pwsh
        run: .\dist\clash-listener-test-win-x64.exe --help

      - name: Write SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\clash-listener-test-win-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  clash-listener-test-win-x64.exe" | Set-Content -Encoding ascii .\dist\clash-listener-test-win-x64.sha256

      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: clash-listener-test-windows-x64
          path: |
            dist/clash-listener-test-win-x64.exe
            dist/clash-listener-test-win-x64.sha256
          if-no-files-found: error
          retention-days: 30
